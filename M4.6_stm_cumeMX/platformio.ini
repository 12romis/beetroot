; PlatformIO Project Configuration File
;
; Цей файл дозволяє відкрити STM32CubeMX-згенерований проєкт напряму в PlatformIO,
; без перенесення файлів у src/ або lib/. Структура Core/Drivers/Middlewares/USB_DEVICE
; залишається такою, якою її генерує CubeMX — це важливо, бо дозволяє й надалі
; перегенеровувати код через "Generate Code" в CubeMX, не ламаючи PlatformIO-проєкт.

[platformio]
default_envs = blackpill_f401ce
; головна тека з "джерелом" — там, де лежить main()
src_dir = Core/Src
include_dir = Core/Inc

[env:blackpill_f401ce]
platform = ststm32
; STM32F401CEUx (512K Flash, UFQFPN48) + HSE 25 МГц з .ioc — це відповідає
; поширеній платі WeAct BlackPill V3.0. Якщо в тебе інша плата на цьому ж чипі —
; env все одно збереться, лише зміни board на свою (pio boards ststm32 | grep 401CE).
board = blackpill_f401ce
framework = stm32cube

; У нас уже є власний CubeMX-згенерований system_stm32f4xx.c, stm32f4xx_hal_conf.h
; та startup — кажемо PlatformIO не підставляти свої шаблони замість них.
board_build.stm32cube.custom_system_setup = yes
board_build.stm32cube.custom_config_header = yes

; НЕ підключаємо свою копію Drivers/STM32F4xx_HAL_Driver і Middlewares/ST/STM32_USB_Device_Library —
; framework-stm32cubef4 вже несе власну (узгоджену Inc+Src) версію HAL і USB Device middleware,
; і PlatformIO LDF підключає її автоматично. Дублювання призводить до конфлікту типів/символів.
build_flags =
  -I Core/Inc
  -I USB_DEVICE/App
  -I USB_DEVICE/Target

; Шляхи тут відносні до src_dir (Core/Src), тому "../../" веде в корінь проєкту.
; У src_dir компілюється лише наш власний CubeMX-код: Core/Src + USB_DEVICE (App/Target).
build_src_filter =
  +<*>
  +<../../USB_DEVICE/App>
  +<../../USB_DEVICE/Target>

; BlackPill найчастіше прошивають через ST-Link (SWD).
upload_protocol = stlink
debug_tool = stlink

; Якщо прошиваєш через вбудований USB (BOOT0 + RESET -> DFU-режим),
; заміни два рядки вище на:
; upload_protocol = dfu
