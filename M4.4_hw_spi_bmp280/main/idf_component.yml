## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=5.3'
  # DS1307 і OLED керуються через СТАРИЙ I2C-драйвер (driver/i2c.h) + nopnop2002 (components/ssd1306).
  # esp-idf-lib (bmp280/ds1307 -> i2cdev -> НОВИЙ I2C-драйвер) тут НЕ підключаємо:
  # одночасна присутність старого і нового драйвера дає abort "driver_ng conflict".
